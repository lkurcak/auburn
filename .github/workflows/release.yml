name: Release

# Merging a PR that bumps the version releases it: forge's shared workflow tags the pushed
# commit and runs again on the tag. Pushing a vX.Y.Z tag by hand still works too.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: lkurcak/forge/.github/workflows/rust-release.yml@v1
    permissions:
      contents: write
      id-token: write
      # The tag job dispatches the run on the tag
      actions: write
    secrets: inherit
    with:
      crates-io: true
